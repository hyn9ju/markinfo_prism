<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRISM 포트폴리오 · 마크인포</title>
<link rel="icon" type="image/jpeg" href="images/asset_1.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-dim:#F5F5F3;
    --ink:#141414;
    --ink-soft:#5C5B54;
    --ink-faint:#9A988F;
    --line:#E7E6E1;
    --mint:#0EB97F;
    --mint-dark:#0A8F63;
    --mint-tint:#E6F7EF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --maxw:1080px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--ink);color:#fff;}
  :focus-visible{outline:2px solid var(--mint-dark);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

  .container{max-width:var(--maxw);margin:0 auto;padding:0 20px;}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:var(--maxw);margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-img{height:22px;width:auto;flex:none;}
  .logo-divider{width:1px;height:16px;background:var(--line);flex:none;}
  .logo-sub{font-weight:800;font-size:13px;letter-spacing:0.01em;color:var(--ink);white-space:nowrap;}
  .nav-links{display:flex;gap:22px;font-size:14px;font-weight:600;}
  .nav-links a{color:var(--ink-soft);padding:6px 2px;border-bottom:2px solid transparent;}
  .nav-links a.active{color:var(--ink);border-color:var(--ink);}
  .like-indicator{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--ink);color:#fff;padding:8px 12px;border-radius:999px;transition:background .2s;}
  .like-indicator.ready{background:var(--mint);}
  .like-indicator svg{width:14px;height:14px;fill:#fff;}

  /* ---------- Hero / Home ---------- */
  .hero{padding:52px 0 8px;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:0.14em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .eyebrow .rule{width:24px;height:3px;border-radius:2px;background:var(--mint);}
  .hero h1{font-size:34px;line-height:1.32;font-weight:800;letter-spacing:-0.01em;margin:0 0 12px;max-width:560px;}
  .hero p.sub{font-size:15px;color:var(--ink-soft);margin:0 0 32px;max-width:480px;line-height:1.6;}



  .home-explore{margin-bottom:60px;}
  .explore-label{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .explore-label span{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .explore-label a{font-size:13px;font-weight:700;color:var(--ink);}

  /* ---------- Gallery grid (Instagram-style) ---------- */
  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
  .gallery-tile{position:relative;aspect-ratio:1/1;overflow:hidden;width:100%;display:block;border-radius:2px;cursor:pointer;padding:0;margin:0;}
  .gallery-tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .tile-ph span{color:rgba(255,255,255,0.92);font-weight:800;font-size:26px;}
  .tile-overlay{position:absolute;inset:0;opacity:0;transition:opacity .15s;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:10px;text-align:left;}
  @media (hover:hover){
    .gallery-tile:hover .tile-overlay{opacity:1;background:linear-gradient(180deg, rgba(20,20,20,0) 35%, rgba(20,20,20,0.62) 100%);}
    .gallery-tile:hover .tile-like-btn{opacity:1;}
  }
  .tile-overlay .tile-name{display:block;color:#fff;font-size:12.5px;font-weight:800;line-height:1.3;}
  .tile-overlay .tile-meta{display:block;color:rgba(255,255,255,0.8);font-size:10.5px;font-weight:600;margin-top:2px;}
  .tile-like-btn{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(20,20,20,0.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;z-index:2;}
  .tile-like-btn svg{width:16px;height:16px;stroke:#fff;stroke-width:2;fill:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.45));}
  .tile-like-btn.active{background:rgba(20,20,20,0.5);}
  .tile-like-btn.active svg{fill:var(--mint);stroke:var(--mint);}
  @media (hover:none){ .tile-like-btn{display:none;} }
  .gallery-empty{padding:60px 10px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.7;}
  .gallery-end{display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 0 50px;}
  .gallery-end span{font-size:12px;color:var(--ink-faint);}
  .back-btn{font-size:13px;font-weight:700;color:var(--ink);border:1.5px solid var(--ink);padding:9px 20px;border-radius:999px;}

  /* ---------- Page head ---------- */
  .page-head{padding:34px 0 22px;}
  .page-head h1{font-size:24px;font-weight:800;margin:0 0 6px;}
  .page-head p{font-size:14px;color:var(--ink-soft);margin:0;}

  /* ---------- Studio grid ---------- */
  .studio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding-bottom:20px;}
  .studio-card{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;display:block;transition:border-color .15s;}
  .studio-card:hover{border-color:var(--ink);}
  .studio-card-thumbs{display:flex;gap:2px;background:var(--paper-dim);}
  .studio-card-thumb{position:relative;overflow:hidden;flex:1;aspect-ratio:1/1;}
  .studio-card-thumb-empty{background:var(--paper-dim);}
  .studio-card-thumb img{width:100%;height:100%;object-fit:cover;}
  .studio-card-body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px;}
  .studio-card-row{display:flex;align-items:center;gap:10px;}
  .studio-name{font-size:15px;font-weight:800;}
  .studio-tags{display:flex;flex-wrap:wrap;gap:6px;}

  .studio-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex:none;object-fit:cover;}
  .studio-avatar.lg{width:76px;height:76px;font-size:26px;}

  /* ---------- Studio profile header ---------- */
  .studio-header{display:flex;align-items:flex-start;gap:18px;padding:30px 0 26px;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .studio-header-info h1{font-size:22px;font-weight:800;margin:0 0 8px;}
  .studio-bio{font-size:14px;color:var(--ink-soft);margin:0 0 12px;line-height:1.6;max-width:460px;}

  /* ---------- Tag chips ---------- */
  .tag-chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;line-height:1;display:inline-flex;}
  .tag-chip.style{background:var(--mint-tint);color:var(--mint-dark);}
  .tag-chip.industry{background:var(--paper-dim);color:var(--ink-soft);}

  /* ---------- Tags view ---------- */
  .tag-section{margin-bottom:26px;}
  .tag-section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .tag-section-title h2{font-size:14px;font-weight:800;margin:0;}
  .tag-section-title span{font-size:12px;color:var(--ink-faint);}
  .tag-cloud{display:flex;flex-wrap:wrap;gap:8px;}
  .tag-toggle{font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);transition:border-color .12s,background .12s,color .12s;}
  .tag-toggle.selected{border-color:transparent;background:var(--mint);color:#fff;}
  .tag-clear-row{margin-top:10px;}
  .tag-clear-btn{font-size:12px;font-weight:700;color:var(--ink-faint);text-decoration:underline;}
  .gallery-section{margin-top:8px;}

  /* ---------- Liked / analysis ---------- */
  .liked-progress{border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;margin:28px 0 26px;}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .progress-top strong{font-size:15px;font-weight:800;}
  .progress-top span{font-size:12px;color:var(--ink-faint);}
  .progress-track{height:8px;border-radius:999px;background:var(--paper-dim);overflow:hidden;margin-bottom:10px;}
  .progress-fill{height:100%;border-radius:999px;background:var(--mint);transition:width .3s;}
  .progress-msg{font-size:13px;color:var(--ink-soft);margin:0;}

  .type-hero{background:var(--mint-tint);border-radius:28px;padding:36px 30px;margin:28px 0 26px;}
  .type-hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .type-hero-top .badge{font-size:11px;font-weight:800;color:var(--mint-dark);background:rgba(255,255,255,0.6);padding:5px 10px;border-radius:999px;}
  .type-hero-code{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;font-weight:800;color:var(--mint-dark);letter-spacing:0.18em;margin-bottom:10px;}
  .type-hero h2{font-size:28px;font-weight:800;margin:0 0 10px;}
  .type-hero-desc{font-size:14.5px;color:var(--ink-soft);margin:0 0 26px;line-height:1.65;max-width:520px;}
  .axis-bars{display:flex;flex-direction:column;gap:12px;margin-bottom:26px;}
  .axis-bar-row{display:grid;grid-template-columns:78px 1fr 78px;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .axis-bar-row .axis-label-a{text-align:right;}
  .axis-bar{height:7px;border-radius:999px;background:rgba(255,255,255,0.7);overflow:hidden;}
  .axis-bar-fill{height:100%;background:var(--mint-dark);}
  .fit-tags-label{font-size:12px;font-weight:800;color:var(--ink-soft);margin-bottom:10px;}
  .fit-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px;}
  .fit-tags .tag-chip{background:rgba(255,255,255,0.7);color:var(--ink-soft);}
  .rec-title{font-size:12px;font-weight:800;color:var(--ink-soft);margin-bottom:10px;}
  .rec-studios{display:flex;flex-direction:column;gap:8px;}
  .rec-studio-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.7);border-radius:var(--radius-sm);}
  .rec-studio-item .studio-avatar{width:34px;height:34px;font-size:13px;}
  .rec-studio-item .studio-name{font-size:13px;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,0.72);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal-content{background:#fff;border-radius:var(--radius-lg);max-width:480px;width:100%;max-height:92vh;overflow-y:auto;position:relative;}
  .modal-close{position:absolute;top:14px;right:14px;z-index:5;background:rgba(0,0,0,0.45);color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .modal-media{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .modal-media img{width:100%;height:100%;object-fit:cover;}
  .modal-media .tile-ph span{font-size:44px;}
  .modal-prev,.modal-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.4);color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .modal-prev{left:10px;} .modal-next{right:10px;}
  .modal-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
  .modal-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.5);}
  .modal-dot.active{background:#fff;}
  .modal-body{padding:20px 22px 24px;}
  .modal-studio-link{font-size:12px;font-weight:700;color:var(--ink-faint);}
  .modal-name{font-size:18px;font-weight:800;margin:6px 0 10px;}
  .modal-desc{font-size:14px;color:var(--ink-soft);line-height:1.65;margin:0 0 14px;}
  .modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .like-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);flex:none;}
  .modal-like-row{display:flex;align-items:center;gap:10px;}
  .hint-bubble{display:flex;align-items:center;gap:8px;background:var(--mint-tint);color:var(--mint-dark);font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;}
  .hint-close{font-size:11px;color:var(--mint-dark);opacity:0.7;line-height:1;}
  .like-btn svg{width:19px;height:19px;stroke:var(--ink-soft);fill:none;transition:fill .12s,stroke .12s;}
  .like-btn.active{border-color:transparent;background:var(--mint-tint);}
  .like-btn.active svg{fill:var(--mint);stroke:var(--mint);}

  /* ---------- Bottom nav (mobile) ---------- */
  .bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));}
  .bottomnav-inner{display:flex;justify-content:space-around;}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink-faint);padding:4px 10px;position:relative;}
  .bottomnav a.active{color:var(--ink);}
  .bottomnav svg{width:21px;height:21px;stroke:currentColor;fill:none;}
  .bottomnav .badge-count{position:absolute;top:-2px;right:2px;background:var(--ink);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:1px 4px;min-width:14px;text-align:center;transition:background .2s;}
  .bottomnav a.ready .badge-count{background:var(--mint);}

  /* ---------- Admin ---------- */
  .admin-note{background:var(--paper-dim);border-radius:var(--radius-md);padding:14px 16px;font-size:13px;color:var(--ink-soft);margin-bottom:24px;line-height:1.6;}
  .admin-note-warn{background:#FBEFE6;color:#8A5A2A;}
  .crop-overlay{position:fixed;inset:0;background:rgba(20,20,20,0.72);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
  .crop-overlay.open{display:flex;}
  .crop-panel{background:var(--paper);border-radius:var(--radius-lg);padding:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto;}
  .crop-head{font-size:15px;font-weight:800;margin-bottom:12px;}
  .crop-stage{position:relative;display:inline-block;max-width:100%;line-height:0;user-select:none;touch-action:none;overflow:hidden;}
  .crop-stage img{max-width:100%;max-height:52vh;display:block;}
  .crop-box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(20,20,20,0.45);cursor:move;}
  .crop-h{position:absolute;width:16px;height:16px;background:#fff;border-radius:3px;}
  .crop-h.nw{left:-9px;top:-9px;cursor:nwse-resize;}
  .crop-h.ne{right:-9px;top:-9px;cursor:nesw-resize;}
  .crop-h.sw{left:-9px;bottom:-9px;cursor:nesw-resize;}
  .crop-h.se{right:-9px;bottom:-9px;cursor:nwse-resize;}
  .crop-ratios{display:flex;gap:6px;margin:14px 0 6px;flex-wrap:wrap;}
  .crop-ratio{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;background:var(--paper);}
  .crop-ratio.active{background:var(--mint);color:#fff;border-color:var(--mint);}
  .admin-hidden-badge{font-size:10px;font-weight:800;color:#8A5A2A;background:#FBEFE6;padding:2px 7px;border-radius:999px;margin-left:auto;}
  .admin-studio-form{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-bottom:18px;}
  .admin-form-col{min-width:0;}
  .admin-tabs{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .admin-tab{padding:10px 4px;font-size:14px;font-weight:700;color:var(--ink-faint);border-bottom:2px solid transparent;margin-right:14px;}
  .admin-tab.active{color:var(--ink);border-color:var(--ink);}
  .admin-block{margin-bottom:34px;}
  .admin-block h2{font-size:15px;font-weight:800;margin:0 0 14px;}
  .admin-item{border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;}
  .admin-row{margin-bottom:10px;}
  .admin-row label{font-size:12px;font-weight:700;color:var(--ink-faint);display:block;margin-bottom:4px;}
  .admin-row input[type=text],.admin-row textarea,.admin-row select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;}
  .admin-row textarea{resize:vertical;min-height:52px;}
  .admin-2col{display:flex;gap:10px;}
  .admin-2col > div{flex:1;}
  .admin-checks{display:flex;flex-wrap:wrap;gap:6px;}
  .admin-check{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);}
  .admin-check input{margin-right:4px;}
  .admin-btn{background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:8px;}
  .admin-btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .admin-btn.danger{background:transparent;color:#B23046;border:1px solid #B23046;}
  .admin-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .admin-export textarea{width:100%;min-height:160px;font-family:monospace;font-size:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--paper-dim);}
  .admin-image-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .admin-image-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .admin-image-thumb img{width:100%;height:100%;object-fit:cover;}
  .admin-image-thumb .remove-btn{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .admin-image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:12px;}
  .admin-image-thumb-lg{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .admin-image-thumb-lg img{width:100%;height:100%;object-fit:cover;display:block;}
  .admin-image-thumb-fade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,0.55) 100%);pointer-events:none;}
  .remove-btn-lg{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .admin-file-input{font-size:12px;margin-bottom:8px;}
  .admin-url-row{display:flex;gap:6px;}
  .admin-url-row input{flex:1;}
  .admin-save-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;}
  .admin-save-hint{font-size:12px;color:var(--ink-faint);}
  .admin-studio-card, .admin-add-card{width:100%;text-align:left;padding:0;font:inherit;}
  .admin-add-card{border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:190px;color:var(--ink-faint);gap:8px;text-align:center;transition:border-color .15s;}
  .admin-add-card:hover{border-color:var(--ink);}
  .admin-add-plus{font-size:30px;font-weight:300;line-height:1;color:var(--ink-faint);}
  .admin-add-tile{border:1.5px dashed var(--line);background:var(--paper-dim);display:flex;align-items:center;justify-content:center;}
  .admin-add-tile:hover{border-color:var(--ink);}
  .back-link{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:16px;display:inline-block;}
  .admin-preview-label{font-size:11px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
  .admin-preview-box{border:1px solid var(--line);border-radius:var(--radius-md);padding:0 20px;margin-bottom:26px;pointer-events:none;}
  .admin-preview-box .studio-header{border-bottom:none;}
  .admin-hint{font-size:12px;color:var(--ink-faint);margin-top:8px;}
  .admin-color-input{width:56px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer;}

  @media (max-width:720px){ .scroll-top-btn{bottom:80px;} }

<script>
(function(){
  "use strict";

  const APP_VERSION = "1.3";
  const APP_DATE = "2026-09-03";
  function nextVersion(v){
    const parts = v.split(".");
    const minor = parseInt(parts[1],10)+1;
    return parts[0]+"."+minor;
  }
  function exportNewVersionHTML(){
    if(pendingImageOps > 0){
      alert("이미지를 처리하는 중이에요. 처리가 끝나면 저장 버튼이 다시 활성화됩니다.");
      return;
    }
    doExportNewVersionHTML();
  }
  // 주의: 마커 리터럴이 이 코드 안에 그대로 등장하면 자기 자신을 치환해버린다.
  // 반드시 분할 결합으로 만들어, 온전한 리터럴은 데이터 블록에만 존재하도록 한다.
  const DM_START = "/*__PRISM" + "_DATA_START__*/";
  const DM_END = "/*__PRISM" + "_DATA_END__*/";
  function buildDataBlock(){
    return "  " + DM_START + "\n"
      + '  const DEFAULT_STUDIOS = ' + JSON.stringify(STUDIOS) + ';\n'
      + '  const DEFAULT_POSTS = ' + JSON.stringify(POSTS) + ';\n'
      + '  const DEFAULT_SETTINGS = ' + JSON.stringify(SETTINGS) + ';\n'
      + "  " + DM_END + "\n";
  }
  function doExportNewVersionHTML(){
    closeModal();
    const adminOverlay = document.getElementById("admin-modal-overlay");
    if(adminOverlay) adminOverlay.classList.remove("open");
    const newVersion = nextVersion(APP_VERSION);
    const todayStr = new Date().toISOString().slice(0,10);

    // 화면에 렌더된 내용(관리자 이미지 미리보기 등)이 파일에 그대로 굳어버리면
    // 같은 이미지가 데이터와 DOM에 두 번 들어가 파일이 2배로 커진다. 캡처 전에 비운다.
    const appEl = document.getElementById("app");
    const modalEl = document.getElementById("modal-content");
    const adminModalEl = document.getElementById("admin-modal-content");
    const keepApp = appEl ? appEl.innerHTML : null;
    if(appEl) appEl.innerHTML = "";
    if(modalEl) modalEl.innerHTML = "";
    if(adminModalEl) adminModalEl.innerHTML = "";

    let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

    if(appEl && keepApp !== null) appEl.innerHTML = keepApp;

    html = html.replace(/const APP_VERSION = "[^"]*";/, function(){ return 'const APP_VERSION = "'+newVersion+'";'; });
    html = html.replace(/const APP_DATE = "[^"]*";/, function(){ return 'const APP_DATE = "'+todayStr+'";'; });

    // 데이터 블록 치환 — 마커 기준. 실패하면 조용히 넘어가지 않고 중단한다.
    const si = html.indexOf(DM_START);
    const ei = html.indexOf(DM_END);
    if(si === -1 || ei === -1 || ei < si){
      alert("저장에 실패했어요: 데이터 삽입 위치(마커)를 찾지 못했습니다. 파일이 손상되었을 수 있어요. 이 파일을 사용하지 말고 알려주세요.");
      return;
    }
    const lineStart = html.lastIndexOf("\n", si) + 1;
    let endLineEnd = html.indexOf("\n", ei);
    if(endLineEnd === -1) endLineEnd = ei + DM_END.length;
    html = html.slice(0, lineStart) + buildDataBlock() + html.slice(endLineEnd + 1);

    // 치환 검증 1단계: 마커와 데이터 선언이 남아있는지
    if(html.indexOf(DM_START) === -1 || html.indexOf(DM_END) === -1){
      alert("저장에 실패했어요: 다음 버전용 표식이 사라졌습니다. 이 파일을 사용하지 말고 알려주세요.");
      return;
    }
    // 치환 검증 2단계: 결과물을 실제로 파싱해 개수를 대조한다.
    let vs, vp;
    try{
      const ms = html.match(/const DEFAULT_STUDIOS = (\[[\s\S]*?\]);\n/);
      const mp = html.match(/const DEFAULT_POSTS = (\[[\s\S]*?\]);\n/);
      vs = JSON.parse(ms[1]);
      vp = JSON.parse(mp[1]);
    }catch(err){
      alert("저장에 실패했어요: 파일에 기록된 데이터를 다시 읽을 수 없습니다. 이 파일을 사용하지 말고 알려주세요.");
      return;
    }
    const wantImgs = totalImageCount();
    const gotImgs = vs.filter(function(s){ return !!s.profileImage; }).length
      + vp.reduce(function(a,p){ return a + ((p.images||[]).length); }, 0);
    if(vs.length !== STUDIOS.length || vp.length !== POSTS.length || gotImgs !== wantImgs){
      alert("저장을 중단했어요: 파일에 기록된 내용이 화면과 다릅니다.\n\n화면: 스튜디오 "+STUDIOS.length+" · 게시물 "+POSTS.length+" · 이미지 "+wantImgs
        +"\n파일: 스튜디오 "+vs.length+" · 게시물 "+vp.length+" · 이미지 "+gotImgs
        +"\n\n이 파일을 사용하지 말고 알려주세요.");
      return;
    }

    const blob = new Blob([html], {type:"text/html"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "prism_portfolio_v"+newVersion+".html";
    a.click();
    alert("v"+newVersion+" 파일이 저장되었습니다 ("+formatBytes(html.length)+").\n검증 완료 — 스튜디오 "+vs.length+"개 · 게시물 "+vp.length+"개 · 이미지 "+gotImgs+"장 ("+formatBytes(totalImageBytes())+")\n이 파일이 다음 버전의 기준이 됩니다.");
  }

  /* ---- 웹 업로드용 폴더 내보내기 (index.html + images/) ----
     이미지를 실제 파일로 분리해서 HTML 자체를 가볍게 만든다.
     이미 이미지 폴더로 분리된 참조(상대경로)는 fetch로 다시 읽어 새 폴더에 복사하고,
     이 화면에서 새로 올린 이미지(data URL)는 바로 파일로 기록한다. */
  function loadJSZip(){
    return new Promise(function(resolve, reject){
      if(window.JSZip){ resolve(window.JSZip); return; }
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
      s.onload = function(){ resolve(window.JSZip); };
      s.onerror = function(){ reject(new Error("load-fail")); };
      document.head.appendChild(s);
    });
  }
  function mimeExt(mime){
    if(!mime) return "jpg";
    if(mime.indexOf("webp")>-1) return "webp";
    if(mime.indexOf("png")>-1) return "png";
    if(mime.indexOf("gif")>-1) return "gif";
    return "jpg";
  }
  function bytesToBase64(bytes){
    let binary = "";
    const chunk = 0x8000;
    for(let i=0;i<bytes.length;i+=chunk){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
    }
    return btoa(binary);
  }
  function dataUrlToBase64(dataUrl){
    const comma = dataUrl.indexOf(",");
    return {base64: dataUrl.slice(comma+1), mime: dataUrl.slice(5, comma).split(";")[0]};
  }
  function fetchAsBase64(path){
    return fetch(path).then(function(res){
      if(!res.ok) throw new Error("fetch-fail");
      return res.arrayBuffer().then(function(buf){
        return {base64: bytesToBase64(new Uint8Array(buf)), mime: res.headers.get("content-type") || ""};
      });
    });
  }
  function exportWebUploadZip(){
    if(pendingImageOps > 0){ alert("이미지를 처리하는 중이에요. 처리가 끝나면 다시 시도해주세요."); return; }
    loadJSZip().then(function(JSZip){
      const newVersion = nextVersion(APP_VERSION);
      const folderName = "프리즘 포트폴리오 v" + newVersion;
      const zip = new JSZip();
      const root = zip.folder(folderName);
      const imgFolder = root.folder("images");

      const studiosCopy = clone(STUDIOS);
      const postsCopy = clone(POSTS);
      let unresolved = 0;

      function resolveImage(value, baseName){
        const task = isDataUrl(value) ? Promise.resolve(dataUrlToBase64(value)) : fetchAsBase64(value);
        return task.then(function(res){
          const filename = baseName + "." + mimeExt(res.mime);
          imgFolder.file(filename, res.base64, {base64:true});
          return filename;
        }).catch(function(){ unresolved++; return null; });
      }

      const jobs = [];
      studiosCopy.forEach(function(s){
        if(!s.profileImage) return;
        jobs.push(resolveImage(s.profileImage, s.id).then(function(fn){ if(fn) s.profileImage = "images/"+fn; }));
      });
      postsCopy.forEach(function(p){
        (p.images||[]).forEach(function(im, idx){
          if(!im) return;
          jobs.push(resolveImage(im, p.id+"_"+idx).then(function(fn){ if(fn) p.images[idx] = "images/"+fn; }));
        });
      });

      return Promise.all(jobs).then(function(){
        const appEl = document.getElementById("app");
        const modalEl = document.getElementById("modal-content");
        const adminModalEl = document.getElementById("admin-modal-content");
        const keepApp = appEl ? appEl.innerHTML : null;
        if(appEl) appEl.innerHTML = "";
        if(modalEl) modalEl.innerHTML = "";
        if(adminModalEl) adminModalEl.innerHTML = "";
        let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        if(appEl && keepApp !== null) appEl.innerHTML = keepApp;

        const todayStr = new Date().toISOString().slice(0,10);
        html = html.replace(/const APP_VERSION = "[^"]*";/, function(){ return 'const APP_VERSION = "'+newVersion+'";'; });
        html = html.replace(/const APP_DATE = "[^"]*";/, function(){ return 'const APP_DATE = "'+todayStr+'";'; });

        const si = html.indexOf(DM_START), ei = html.indexOf(DM_END);
        if(si === -1 || ei === -1 || ei < si) throw new Error("marker-missing");
        const lineStart = html.lastIndexOf("\n", si) + 1;
        let endLineEnd = html.indexOf("\n", ei);
        if(endLineEnd === -1) endLineEnd = ei + DM_END.length;
        const newBlock = "  " + DM_START + "\n"
          + '  const DEFAULT_STUDIOS = ' + JSON.stringify(studiosCopy) + ';\n'
          + '  const DEFAULT_POSTS = ' + JSON.stringify(postsCopy) + ';\n'
          + '  const DEFAULT_SETTINGS = ' + JSON.stringify(SETTINGS) + ';\n'
          + "  " + DM_END + "\n";
        html = html.slice(0, lineStart) + newBlock + html.slice(endLineEnd + 1);

        // 검증: 이미지 경로가 실제로 이미지 폴더를 가리키는지, 개수가 맞는지
        let vs, vp;
        const ms = html.match(/const DEFAULT_STUDIOS = (\[[\s\S]*?\]);\n/);
        const mp = html.match(/const DEFAULT_POSTS = (\[[\s\S]*?\]);\n/);
        vs = JSON.parse(ms[1]); vp = JSON.parse(mp[1]);
        if(vs.length !== STUDIOS.length || vp.length !== POSTS.length) throw new Error("count-mismatch");

        // 마무리: STUDIOS/POSTS 외에 정적 마크업에 남은 base64 이미지(로고, 파비콘 등)도
        // 전부 파일로 분리한다. 어떤 요소인지 몰라도 되도록 범용으로 처리.
        let assetIdx = 0;
        const assetJobs = [];
        html = html.replace(/(src|href)="(data:image\/[a-zA-Z0-9.+-]+;base64,[^"]+)"/g, function(whole, attr, dataUrl){
          const idx = ++assetIdx;
          const placeholder = "__ASSET_" + idx + "__";
          assetJobs.push({placeholder: placeholder, dataUrl: dataUrl});
          return attr + '="' + placeholder + '"';
        });
        assetJobs.forEach(function(job){
          const res = dataUrlToBase64(job.dataUrl);
          const filename = "asset_" + job.placeholder.replace(/\D/g, "") + "." + mimeExt(res.mime);
          imgFolder.file(filename, res.base64, {base64:true});
          html = html.split(job.placeholder).join("images/" + filename);
        });

        root.file("index.html", html);
        return zip.generateAsync({type:"blob"}).then(function(blob){ return {blob:blob, folderName:folderName, unresolved:unresolved}; });
      });
    }).then(function(r){
      const a = document.createElement("a");
      a.href = URL.createObjectURL(r.blob);
      a.download = r.folderName + ".zip";
      a.click();
      alert(r.folderName + ".zip 파일이 저장되었습니다.\n압축을 풀면 index.html과 images 폴더가 나와요 — 이 폴더째로 웹 서버에 올리면 됩니다."
        + (r.unresolved ? "\n\n※ 이미지 "+r.unresolved+"개는 다시 읽어오지 못해 이전 경로를 그대로 두었어요. 기존 images 폴더에서 해당 파일을 함께 복사해주세요." : ""));
    }).catch(function(err){
      if(err && err.message === "load-fail"){
        alert("웹 업로드용 내보내기에 필요한 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해주세요.");
      } else if(err && err.message === "marker-missing"){

  function clone(x){ return JSON.parse(JSON.stringify(x)); }

  let webpOK = null;
  function supportsWebp(){

      c.width = 2; c.height = 2;

  function encodeBest(canvas, maxBytes){
    // WebP가 되면 WebP, 아니면 JPEG. 화질을 낮춰가며 상한을 맞춘다.
    const type = supportsWebp() ? "image/webp" : "image/jpeg";
    let q = 0.86, out = canvas.toDataURL(type, q);
    let bytes = Math.round(out.length * 3/4);
    while(bytes > maxBytes && q > 0.42){
      q -= 0.12;
      out = canvas.toDataURL(type, q);
      bytes = Math.round(out.length * 3/4);
    }
    return {dataUrl: out, bytes: bytes, type: type, quality: q};

  // drawImage는 디코딩을 다시 하지 않고 브라우저가 이미 갖고 있는 픽셀을 그대로 쓴다 — 재디코딩 없음.
  function resizeEncodeFrom(imgEl, sx, sy, sw, sh, maxDim, maxBytes){
    let dw = sw, dh = sh;
    if(dw > maxDim || dh > maxDim){
      if(dw >= dh){ dh = Math.round(dh * maxDim / dw); dw = maxDim; }
      else { dw = Math.round(dw * maxDim / dh); dh = maxDim; }
    }
    const canvas = document.createElement("canvas");
    canvas.width = dw; canvas.height = dh;
    canvas.getContext("2d").drawImage(imgEl, sx, sy, sw, sh, 0, 0, dw, dh);
    return encodeBest(canvas, maxBytes);
  }

  const IDB_NAME = "prism_portfolio";

  let idbPromise = null;
  function idbOpen(){
    if(idbPromise) return idbPromise;
    idbPromise = new Promise(function(resolve){
      try{
        if(!window.indexedDB){ resolve(null); return; }
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = function(){
          const db = req.result;
          if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ resolve(null); };
        req.onblocked = function(){ resolve(null); };
        setTimeout(function(){ resolve(null); }, 4000);
      }catch(e){ resolve(null); }
    });
    return idbPromise;
  }
  function idbPut(key, val){
    return idbOpen().then(function(db){
      if(!db) return false;
      return new Promise(function(resolve){
        try{
          const tx = db.transaction(IDB_STORE, "readwrite");
          tx.objectStore(IDB_STORE).put(val, key);
          tx.oncomplete = function(){ resolve(true); };
          tx.onerror = function(){ resolve(false); };
          tx.onabort = function(){ resolve(false); };
        }catch(e){ resolve(false); }
      });
    });
  }

        try{
          const tx = db.transaction(IDB_STORE, "readonly");
          const r = tx.objectStore(IDB_STORE).get(key);
          r.onsuccess = function(){ resolve(r.result || null); };
          r.onerror = function(){ resolve(null); };
        }catch(e){ resolve(null); }
      });
    });
  }

        }catch(e){ resolve(false); }
      });
    });
  }

    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    if(!draftDirty) return Promise.resolve();
    const payload = {stamp:dataStamp(), studios:STUDIOS, posts:POSTS, settings:SETTINGS, savedAt:new Date().toISOString()};
    return idbPut(draftKey(), payload).then(function(ok){
      if(ok){
        storageMode = "idb";
        draftDirty = false;
        draftSavedAt = payload.savedAt;
        // IndexedDB에 온전히 저장됐으므로 낡은 localStorage 초안은 정리한다.
        try{ localStorage.removeItem(draftKey()); }catch(e){}
        return;
      }
      // IndexedDB 사용 불가 → localStorage로 강등
      try{
        localStorage.setItem(draftKey(), JSON.stringify(payload));
        storageMode = "local";
        draftDirty = false;
        draftSavedAt = payload.savedAt;
        return;
      }catch(e){}
      try{
        localStorage.setItem(draftKey(), JSON.stringify({stamp:payload.stamp, studios:stripImages(STUDIOS), posts:stripImages(POSTS), settings:SETTINGS, savedAt:payload.savedAt}));
        storageMode = "nomedia";
        draftDirty = false;
        if(!flushDraft._warned){
          flushDraft._warned = true;
          alert("이 브라우저에서는 큰 이미지를 초안으로 보관할 수 없어, 글자 정보만 남겼어요.\n\n이미지는 지금 화면에는 그대로 있지만 새로고침하면 사라집니다.\n작업을 마치면 '새 버전으로 저장'을 눌러 HTML 파일로 보관해주세요. 그 파일에는 이미지가 온전히 들어갑니다.");
        }
      }catch(e2){
        storageMode = "failed";
        if(!flushDraft._warned2){
          flushDraft._warned2 = true;
          alert("이 브라우저에서는 초안을 저장할 수 없어요. 작업 내용은 화면에만 남아 있으니, 새로고침하기 전에 '새 버전으로 저장'을 눌러 HTML로 보관해주세요.");
        }
      }
    });
  }
  function resetData(){

      try{ localStorage.removeItem(draftKey()); }catch(e){}

    });

  function getStudio(id){ return STUDIOS.find(s=>s.id===id); }
  function getPost(id){ return POSTS.find(p=>p.id===id); }
  function postsByStudio(id){ return POSTS.filter(p=>p.studioId===id); }
  function visiblePosts(){ return POSTS.filter(function(p){ const st=getStudio(p.studioId); return st && !st.hidden; }); }
  function studioTopTags(id, max){
    max = max||3;
    const counts = {};
    postsByStudio(id).forEach(function(p){
      if(!p.styleType) return;
      counts[p.styleType] = (counts[p.styleType]||0)+1;
    });
    return Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }).slice(0,max);
  }
  function sortByDateDesc(arr){ return arr.slice().sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); }); }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function hashCode(str){ let h=0; for(let i=0;i<String(str).length;i++){ h=(h*31+String(str).charCodeAt(i))|0; } return h; }
  function phBg(id){ return MINT_SHADES[Math.abs(hashCode(id))%MINT_SHADES.length]; }
  function studioAvatarColor(name){ return MINT_SHADES[Math.abs(hashCode(name))%MINT_SHADES.length]; }
  function studioInitial(name){
    name = (name||"?").trim();
    return name.charAt(0) || "?";
  }
  function studioDisplayInitial(st){
    if(st.avatarInitial && st.avatarInitial.trim()) return st.avatarInitial.trim().slice(0,2);
    return studioInitial(st.name);
  }
  function contrastTextColor(hex){
    const c = (hex||"").replace("#","");
    if(c.length!==6) return "#ffffff";
    const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
    if(isNaN(r)||isNaN(g)||isNaN(b)) return "#ffffff";
    const lum = (0.299*r + 0.587*g + 0.114*b)/255;
    return lum > 0.6 ? "#141414" : "#ffffff";
  }

  function loadMoreHomePosts(){

    const grid = document.querySelector(".home-explore .gallery-grid");
    if(grid) grid.insertAdjacentHTML("beforeend", next.map(function(p){ return postTileHTML(p,{showStudio:true}); }).join(""));
    if(homeShownCount >= homeAllPosts.length){
      if(homeObserver){ homeObserver.disconnect(); homeObserver = null; }
      const sentinel = document.getElementById("home-load-sentinel");

  function setupHomeInfiniteScroll(){
    if(homeObserver){ homeObserver.disconnect(); homeObserver = null; }
    const sentinel = document.getElementById("home-load-sentinel");
    if(!sentinel || typeof IntersectionObserver === "undefined") return;
    homeObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){ if(entry.isIntersecting) loadMoreHomePosts(); });
    }, {rootMargin:"800px 0px"});
    homeObserver.observe(sentinel);
  }

  function computeTally(likedPosts){
    const tally = { weight:{G:0,L:0}, energy:{B:0,S:0}, persuasion:{E:0,R:0}, era:{C:0,M:0} };
    likedPosts.forEach(function(p){
      const t = typeByName(p.styleType);
      if(!t) return;
      const d = decodeCode(t.code);
      tally.weight[d.weight]++; tally.energy[d.energy]++; tally.persuasion[d.persuasion]++; tally.era[d.era]++;
    });
    return tally;
  }
  function resultTypeFromTally(tally){
    const code = (tally.weight.G>=tally.weight.L?"G":"L")
      + (tally.energy.B>=tally.energy.S?"B":"S")
      + (tally.persuasion.E>=tally.persuasion.R?"E":"R")
      + (tally.era.C>=tally.era.M?"C":"M");
    return TYPES_16.find(t=>t.code===code) || TYPES_16[0];
  }
  function recommendStudios(resultType){
    const scored = STUDIOS.map(function(st){
      let score = 0;
      postsByStudio(st.id).forEach(function(p){
        const t = typeByName(p.styleType);
        if(!t) return;
        for(let i=0;i<4;i++){ if(t.code[i]===resultType.code[i]) score++; }
      });
      return {studio:st, score:score};
    }).sort(function(a,b){ return b.score-a.score; });
    return scored.filter(s=>s.score>0).slice(0,2).map(s=>s.studio);
  }

  function renderModal(postId, index){
    const post = getPost(postId); if(!post) return;
    const studio = getStudio(post.studioId) || {id:"",name:""};
    const liked = getLikedIds().indexOf(post.id)>-1;
    const images = (post.images&&post.images.length) ? post.images : [null];

  function bulkUploadToStudio(studioId, fileList){
    const files = Array.from(fileList||[]);
    if(!files.length) return;
    const limit = SETTINGS.studioImageLimit || 20;
    const already = postsByStudio(studioId).length;
    const room = Math.max(0, limit - already);
    if(room <= 0){
      alert("이 스튜디오는 이미 제한("+limit+"개)에 도달했어요. 설정 탭에서 제한을 늘리거나 기존 게시물을 정리해주세요.");
      return;
    }
    const toProcess = files.slice(0, room);
    const skipped = files.length - toProcess.length;
    beginImageOp();
    const results = [];
    sheetBulkProgress = {done:0, total:toProcess.length};
    updateSheetProgressUI();
    function processNext(i){
      if(i >= toProcess.length){
        POSTS.push.apply(POSTS, results);
        saveData();
        endImageOp();
        sheetBulkProgress = null;
        refreshAdminBody();
        if(skipped > 0) alert("스튜디오 제한("+limit+"개)을 넘어서는 "+skipped+"장은 올리지 않았어요. 나머지 "+results.length+"장은 새 게시물로 추가됐습니다.");
        return;
      }
      const file = toProcess[i];
      const reader = new FileReader();
      reader.onload = function(){
        compressImageDataUrl(reader.result, MAX_IMAGE_DIM, MAX_IMAGE_BYTES).then(function(dataUrl){
          const baseName = (file.name||"제목 없음").replace(/\.[^.]+$/,"");
          results.push({id:"p"+Date.now()+"-"+Math.random().toString(36).slice(2,7), studioId:studioId, name:baseName, description:"", styleType:"", industryTags:[], images:[dataUrl], createdAt:new Date().toISOString().slice(0,10)});
          sheetBulkProgress = {done: sheetBulkProgress.done+1, total: toProcess.length};
          updateSheetProgressUI();
          processNext(i+1);
        });
      };
      reader.onerror = function(){
        sheetBulkProgress = {done: sheetBulkProgress.done+1, total: toProcess.length};
        processNext(i+1);
      };
      reader.readAsDataURL(file);
    }
    processNext(0);
  }
  function updateSheetProgressUI(){
    const el = document.getElementById("sheet-progress");
    if(el) el.textContent = sheetBulkProgress ? ("업로드 중… "+sheetBulkProgress.done+" / "+sheetBulkProgress.total) : "";
  }

  function renderAdminExport(){
    const json = JSON.stringify({studios:STUDIOS, posts:POSTS}, null, 2);
    const imgBytes = totalImageBytes();
    const imgCount = totalImageCount();
    const memCount = STUDIOS.filter(s=>isDataUrl(s.profileImage)).length
      + POSTS.reduce(function(a,p){ return a + (p.images||[]).filter(isDataUrl).length; }, 0);
    const fileCount = imgCount - memCount;
    const degraded = (storageMode === "nomedia" || storageMode === "failed");
    const modeNote = storageMode === "idb"
      ? '초안 저장: <strong>정상 (IndexedDB)</strong> — 이미지까지 함께 보관됩니다.'
      : (storageMode === "local"
        ? '초안 저장: 간이 모드(localStorage) — 용량이 커지면 이미지가 빠질 수 있어요.'

  function optimizeAllImages(){
    const before = totalImageBytes();
    const jobs = [];
    STUDIOS.forEach(function(s){
      if(isDataUrl(s.profileImage)){
        jobs.push(compressImageDataUrl(s.profileImage, MAX_IMAGE_DIM, MAX_IMAGE_BYTES).then(function(out){ s.profileImage = out; }));
      }
    });
    POSTS.forEach(function(p){
      (p.images||[]).forEach(function(im, idx){
        if(!isDataUrl(im)) return;
        jobs.push(compressImageDataUrl(im, MAX_IMAGE_DIM, MAX_IMAGE_BYTES).then(function(out){ p.images[idx] = out; }));
      });
    });
    if(!jobs.length){ alert("최적화할 이미지가 없어요. (이미 이미지 폴더로 분리된 이미지는 대상에서 제외돼요)"); return; }
    beginImageOp();
    Promise.all(jobs).then(function(){
      const after = totalImageBytes();
      saveData();
      endImageOp();
      refreshAdminBody();
      const saved = before - after;
      alert("이미지 최적화 완료.\n\n이전: "+formatBytes(before)+"\n이후: "+formatBytes(after)+"\n절감: "+formatBytes(saved > 0 ? saved : 0)+"\n\n'새 버전으로 저장'을 눌러 HTML 파일로 보관해주세요.");
    }).catch(function(){
      endImageOp();
      alert("최적화 중 문제가 발생했어요. 다시 시도해주세요.");
    });
  }

  function handleAdminFieldChange(el){
    const entity = el.dataset.entity, id = el.dataset.id, field = el.dataset.field;
    const arr = entity==="studio" ? STUDIOS : POSTS;
    const obj = arr.find(o=>o.id===id);
    if(!obj) return;

    if(el.type==="file"){
      const files = Array.from(el.files||[]);
      if(!files.length) return;
      beginImageOp();
      readAndCompressFiles(files).then(function(results){
        if(field==="profileImage") obj.profileImage = results[0];
        saveData();
        refreshAdminBody();
        endImageOp();
      });
      return;
    }
    if(field==="industryTag"){
      const tag = el.dataset.tag; obj.industryTags = obj.industryTags||[];
      const i = obj.industryTags.indexOf(tag);
      if(el.checked && i<0) obj.industryTags.push(tag);
      if(!el.checked && i>-1) obj.industryTags.splice(i,1);
    } else {
      obj[field] = el.value;
    }
    saveData();
    if(entity==="studio" && adminEditingStudioId===id){ refreshAdminBody(); }
  }
  function handleAdminAction(el){
    const action = el.dataset.adminAction;
    if(action==="new-studio"){
      const st = {id:"s"+Date.now(), name:"새 스튜디오", bio:"", tags:[], profileImage:null, avatarColor:null};
      STUDIOS.push(st);
      adminEditingStudioId = st.id;
      saveData(); refreshAdminBody();
    } else if(action==="edit-studio"){
      adminEditingStudioId = el.dataset.id; refreshAdminBody();
    } else if(action==="back-to-studios"){
      adminEditingStudioId = null; refreshAdminBody();
    } else if(action==="delete-studio"){
      if(!confirm("이 스튜디오와 소속 게시물을 모두 삭제할까요? 되돌릴 수 없어요.")) return;
      STUDIOS = STUDIOS.filter(s=>s.id!==el.dataset.id);
      POSTS = POSTS.filter(p=>p.studioId!==el.dataset.id);
      adminEditingStudioId = null;
      saveData(); refreshAdminBody();
    } else if(action==="toggle-hide-studio"){
      const st = getStudio(el.dataset.id);
      if(st){ st.hidden = !st.hidden; saveData(); refreshAdminBody(); }
    } else if(action==="remove-profile-image"){
      const st = getStudio(el.dataset.id); if(st){ st.profileImage=null; saveData(); refreshAdminBody(); }
    } else if(action==="delete-sheet-post"){
      if(!confirm("이 게시물을 삭제할까요? 되돌릴 수 없어요.")) return;
      POSTS = POSTS.filter(function(p){ return p.id !== el.dataset.id; });
      saveData(); refreshAdminBody();
    } else if(action==="save-settings"){
      const inp = document.getElementById("settings-studio-limit");
      let n = inp ? parseInt(inp.value,10) : NaN;
      if(!Number.isFinite(n) || n < 1) n = 1;
      if(n > 500) n = 500;
      SETTINGS.studioImageLimit = n;
      saveData();
      refreshAdminBody();
    } else if(action==="new-post"){
      const studioId = el.dataset.studio;
      const count = postsByStudio(studioId).length;
      const limit = SETTINGS.studioImageLimit || 20;
      if(count >= limit){
        alert("한 스튜디오에는 게시물을 최대 "+limit+"개까지 등록할 수 있어요. 기존 게시물을 정리하거나 설정에서 제한을 늘려주세요.");
        return;
      }
      openAdminPostModal(null, studioId);
    } else if(action==="edit-post"){
      const p = getPost(el.dataset.id);
      if(p) openAdminPostModal(p.id, p.studioId);
    } else if(action==="modal-remove-image"){
      adminModalImages.splice(parseInt(el.dataset.idx,10),1);
      adminModalDirty = true;
      renderAdminPostModal();
    } else if(action==="save-post-modal"){
      if(adminModalSaving) return;
      if(pendingImageOps > 0){ alert("이미지를 처리하는 중이에요. 잠시 후 저장해주세요."); return; }
      const name = document.getElementById("admin-modal-name").value.trim();
      if(!name){ alert("프로젝트명을 입력해주세요."); return; }
      adminModalSaving = true;
      try{
        const desc = document.getElementById("admin-modal-desc").value.trim();
        const styleType = document.getElementById("admin-modal-style").value;
        const industryTags = Array.from(document.querySelectorAll("#admin-modal-industry input:checked")).map(i=>i.value);
        if(adminEditingPostId){
          const p = getPost(adminEditingPostId);
          p.name=name; p.description=desc; p.styleType=styleType; p.industryTags=industryTags; p.images=adminModalImages.slice();
        } else {
          POSTS.push({id:"p"+Date.now()+"-"+Math.random().toString(36).slice(2,7), studioId:adminEditingPostStudioId, name:name, description:desc, styleType:styleType, industryTags:industryTags, images:adminModalImages.slice(), createdAt:new Date().toISOString().slice(0,10)});
        }
        saveData();
        adminModalDirty = false;
      } finally {
        closeAdminModal();
      }
    } else if(action==="delete-post-modal"){
      if(adminModalSaving) return;
      adminModalSaving = true;
      try{
        if(adminEditingPostId){ POSTS = POSTS.filter(p=>p.id!==adminEditingPostId); saveData(); }
        adminModalDirty = false;
      } finally {
        closeAdminModal();
      }
    } else if(action==="reset-data"){
      if(confirm("샘플 데이터로 초기화할까요? 편집한 내용이 사라져요.")) resetData();
    } else if(action==="copy-json"){
      const ta = document.getElementById("export-json"); ta.select();
      try{ document.execCommand("copy"); alert("클립보드에 복사했어요."); }catch(e){ alert("복사에 실패했어요. 직접 선택해서 복사해주세요."); }
    } else if(action==="download-json"){
      const json = JSON.stringify({studios:STUDIOS, posts:POSTS}, null, 2);
      const blob = new Blob([json], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "prism-data.json"; a.click();
    } else if(action==="discard-draft"){
      if(confirm("이 브라우저에 남은 초안을 삭제하고, 파일에 담긴 원본 내용으로 되돌릴까요?")) discardDraft();
    } else if(action==="optimize-images"){
      if(confirm("모든 이미지를 1600px · 1MB 이하로 다시 압축할까요? 원본 화질로는 되돌릴 수 없어요.")) optimizeAllImages();
    } else if(action==="save-new-version"){
      exportNewVersionHTML();
    } else if(action==="export-web-zip"){
      exportWebUploadZip();
    }
  }

  document.addEventListener("mousedown", function(e){
    adminOverlayMouseDownOnBackdrop = (e.target.id==="modal-overlay" || e.target.id==="admin-modal-overlay");
  });
  document.addEventListener("click", function(e){
    const likeBtn = e.target.closest(".like-btn");
    if(likeBtn){ toggleLike(likeBtn.dataset.likeId); return; }

    const tagToggle = e.target.closest(".tag-toggle");
    if(tagToggle){ toggleTypeFilter(tagToggle.dataset.tag, tagToggle.dataset.type); return; }

    const gotoStyle = e.target.closest("[data-goto-style]");
    if(gotoStyle){ gotoTagFilter(gotoStyle.dataset.gotoStyle, "style"); return; }
    const gotoInd = e.target.closest("[data-goto-industry]");
    if(gotoInd){ gotoTagFilter(gotoInd.dataset.gotoIndustry, "industry"); return; }

    const clearTags = e.target.closest("[data-clear-tags]");
    if(clearTags){ selectedTypes.clear(); selectedIndustry.clear(); mountHome(); return; }

    const opener = e.target.closest("[data-open-post]");
    if(opener){ openPostModal(opener.dataset.openPost); return; }

    const goback = e.target.closest("[data-goback]");
    if(goback){ history.back(); return; }

    if(e.target.closest("[data-dismiss-hint]")){ dismissHint(); return; }
    if(e.target.closest("[data-modal-close]") || (e.target.id==="modal-overlay" && adminOverlayMouseDownOnBackdrop)){ closeModal(); return; }
    if(e.target.closest("[data-modal-prev]")){ shiftModalImage(-1); return; }
    if(e.target.closest("[data-modal-next]")){ shiftModalImage(1); return; }

    const adminTabBtn = e.target.closest("[data-admin-tab]");
    if(adminTabBtn){ adminTab = adminTabBtn.dataset.adminTab; adminEditingStudioId=null; document.getElementById("app").innerHTML = renderAdmin(); return; }

    if(e.target.closest("[data-admin-modal-close]") || (e.target.id==="admin-modal-overlay" && adminOverlayMouseDownOnBackdrop)){ requestCloseAdminModal(); return; }

    const adminAction = e.target.closest("[data-admin-action]");
    if(adminAction){ handleAdminAction(adminAction); return; }
  });

  });

    if(el && el.tagName === "IMG" && el.hasAttribute("data-sheet-check-img")){
      const div = document.createElement("div");
      div.className = "sheet-thumb-broken";

  document.addEventListener("change", function(e){

      const files = Array.from(e.target.files||[]);

      beginImageOp();

  window.addEventListener("hashchange", render);
  document.addEventListener("pointerdown", function(ev){
    const h = ev.target.closest(".crop-h");
    const box = ev.target.closest("#crop-box");
    if(!h && !box) return;
    ev.preventDefault();
    cropDrag = {
      mode: h ? h.dataset.h : "move",
      sx: ev.clientX, sy: ev.clientY,
      start: Object.assign({}, cropBoxRect)
    };
  });
  document.addEventListener("pointermove", function(ev){
    if(!cropDrag) return;
    const e = cropEls();
    const dw = e.img.clientWidth, dh = e.img.clientHeight;
    const dx = ev.clientX - cropDrag.sx, dy = ev.clientY - cropDrag.sy;
    const s = cropDrag.start;
    let r = Object.assign({}, s);
    if(cropDrag.mode === "move"){
      r.x = Math.min(Math.max(0, s.x + dx), dw - s.w);
      r.y = Math.min(Math.max(0, s.y + dy), dh - s.h);
    } else {
      let nw = s.w, nh = s.h, nx = s.x, ny = s.y;
      if(cropDrag.mode === "se"){ nw = s.w + dx; }
      if(cropDrag.mode === "ne"){ nw = s.w + dx; }
      if(cropDrag.mode === "sw"){ nw = s.w - dx; nx = s.x + dx; }
      if(cropDrag.mode === "nw"){ nw = s.w - dx; nx = s.x + dx; }
      nw = Math.max(24, nw);
      nh = cropRatio > 0 ? nw / cropRatio : Math.max(24, (cropDrag.mode === "nw" || cropDrag.mode === "ne") ? s.h - dy : s.h + dy);
      if(cropDrag.mode === "nw" || cropDrag.mode === "ne"){ ny = s.y + (s.h - nh); }
      if(nx < 0){ nx = 0; }
      if(ny < 0){ ny = 0; }
      if(nx + nw > dw){ nw = dw - nx; if(cropRatio > 0) nh = nw / cropRatio; }
      if(ny + nh > dh){ nh = dh - ny; if(cropRatio > 0) nw = nh * cropRatio; }
      r = {x:nx, y:ny, w:nw, h:nh};
    }
    cropBoxRect = r;
    drawCropBox();
  });
  document.addEventListener("pointerup", function(){ cropDrag = null; });
  document.addEventListener("click", function(ev){
    const rb = ev.target.closest(".crop-ratio");
    if(rb){
      document.querySelectorAll(".crop-ratio").forEach(function(b){ b.classList.remove("active"); });
      rb.classList.add("active");
      cropRatio = parseFloat(rb.dataset.ratio);
      resetCropBox();
      return;
    }
    if(ev.target.id === "crop-apply"){ applyCrop(false); return; }
    if(ev.target.id === "crop-skip"){ applyCrop(true); return; }
    if(ev.target.id === "crop-cancel"){
      cropQueue = [];
      document.getElementById("crop-overlay").classList.remove("open");
      const cb = cropDone; cropDone = null;
      const out = cropResults.slice(); cropResults = [];
      if(cb) cb(out);
      return;
    }
  });

  /* ---------- 최상단으로 가기 버튼 ---------- */
  const SCROLL_TOP_THRESHOLD = 480;
  let scrollTopTicking = false;
  function initScrollTopButton(){
    const btn = document.getElementById("scroll-top-btn");
    if(!btn) return;
    btn.addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
    window.addEventListener("scroll", function(){
      if(scrollTopTicking) return;
      scrollTopTicking = true;
      requestAnimationFrame(function(){
        btn.classList.toggle("show", window.scrollY > SCROLL_TOP_THRESHOLD);
        scrollTopTicking = false;
      });
    }, {passive:true});
  }
  window.addEventListener("DOMContentLoaded", function(){
    loadData();
    render();
    initScrollTopButton();
    // 초안은 IndexedDB에서 비동기로 읽어온다. 복원되면 화면을 다시 그린다.
    restoreDraft().then(function(applied){
      if(applied || draftState === "mismatch") render();
    });
  });
  // 탭을 닫거나 숨길 때 대기 중인 초안을 즉시 기록한다(디바운스로 유실되지 않게).
  window.addEventListener("pagehide", function(){ flushDraft(); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") flushDraft();
  });
})();
</script>
